name: Build DREAMMIC

on:
  push:
    branches: [main]
    paths: ['dreammic_plugin/**', '.github/workflows/dreammic.yml',
            'mirrorwall_plugin/Source/Live.h', 'mirrorwall_plugin/Source/Design.h', 'mirrorwall_plugin/Source/GData.h']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VST3 + test tool
        run: |
          cmake -S dreammic_plugin -B build -A x64
          cmake --build build --config Release --target Dreammic_VST3 dm_render dm_test

      - name: Smoke-test (LIVE and HQ render)
        shell: pwsh
        run: |
          python -c "import wave,struct,math; w=wave.open('t.wav','w'); w.setnchannels(2); w.setsampwidth(2); w.setframerate(44100); w.writeframes(b''.join(struct.pack('<hh',int(8000*math.sin(i*0.03)),int(8000*math.sin(i*0.03))) for i in range(88200))); w.close()"
          $r = Get-ChildItem -Recurse build -Filter dm_render.exe | Select-Object -First 1
          & $r.FullName t.wav live.wav mode=0 mic=0 pre=0
          & $r.FullName t.wav hq.wav mode=1 mic=5 pre=2
          if (-not (Test-Path hq.wav)) { throw "render failed" }
          & $r.FullName t.wav v2.wav mode=0 mic=18 pre=12 comptype=3 deess=5 match=1 autoin=1 lowcut=1
          if (-not (Test-Path v2.wav)) { throw "v2 render failed" }

      - name: Numeric tests (curves, LIVE vs HQ, preamps, comps, level match, old projects, presets)
        shell: pwsh
        run: |
          $t = Get-ChildItem -Recurse build -Filter dm_test.exe | Select-Object -First 1
          & $t.FullName | Tee-Object dm_test_report.txt
          if (Select-String -Path dm_test_report.txt -Pattern "FAIL") { throw "dm_test failed" }

      - name: Package
        shell: pwsh
        run: |
          $vst = "build/Dreammic_artefacts/Release/VST3/DREAMMIC.vst3"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse $vst out/
          Compress-Archive -Path out/* -DestinationPath DREAMMIC-Windows.zip -Force

      - name: Publish download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dreammic-latest
          name: DREAMMIC (latest build)
          body: |
            Download **DREAMMIC-Windows.zip**, unzip it, and copy the `DREAMMIC.vst3` folder into
            `C:\Program Files\Common Files\VST3\` (replace the old one). Same plugin, so no rescan needed;
            old projects open with the same settings (new v2 features start switched off).
          files: DREAMMIC-Windows.zip
          make_latest: false
